name: Deploy a GitHub Pages

# Publica a GitHub Pages en cada push a main.
# ⚠️ Configura en el repo: Settings → Pages → Source: "GitHub Actions".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Instalar, comprobar y construir con Astro
        uses: withastro/action@v6
        env:
          SITE_URL: ${{ vars.SITE_URL || steps.pages.outputs.origin }}
          SITE_BASE: ${{ vars.SITE_BASE || steps.pages.outputs.base_path || '/' }}
          SITE_INDEXABLE: 'true'
        with:
          node-version: 24
          build-cmd: npm run check && npm run test:qa

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v5
